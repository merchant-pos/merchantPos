<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 730" width="980" height="730">
  <defs><symbol id="opsi0" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g0)"/>
  <!-- Batang dan lengan bawah huruf K, putih -->
  <rect x="132" y="140" width="54" height="232" rx="16" fill="#fff"/>
  <path d="M198 250 h68 L374 372 h-88 Z" fill="#fff"/>
  <!-- Lengan atas jadi anak panah yang menunjuk keluar: maju, bukan mundur -->
  <path d="M198 262 L318 156" stroke="#F59E0B" stroke-width="54" stroke-linecap="round" fill="none"/>
  <g transform="translate(338,140) rotate(-41)">
    <path d="M-10 -48 L46 0 L-10 48 Z" fill="#F59E0B"/>
  </g>
</symbol><symbol id="opsi1" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g1)"/>
  <!-- Sudut pemindai QR: bentuk yang langsung dikenali sebagai "scan" -->
  <g fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 186 v-40 a26 26 0 0 1 26 -26 h40"/>
    <path d="M392 186 v-40 a26 26 0 0 0 -26 -26 h-40"/>
    <path d="M120 326 v40 a26 26 0 0 0 26 26 h40"/>
    <path d="M392 326 v40 a26 26 0 0 1 -26 26 h-40"/>
  </g>
  <!-- Tombol "Go" di tengah bidang pindai -->
  <circle cx="256" cy="256" r="74" fill="#F59E0B"/>
  <path d="M232 216 l64 40 l-64 40 Z" fill="#3730A3"/>
</symbol><symbol id="opsi2" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g2)"/>
  <!-- Gelembung pesanan, ekornya menunjuk maju -->
  <path d="M118 168 a52 52 0 0 1 52 -52 h172 a52 52 0 0 1 52 52 v104 a52 52 0 0 1 -52 52 h-96 l-76 68 v-68 h-0 a52 52 0 0 1 -52 -52 Z" fill="#fff"/>
  <!-- Tiga baris pesanan, yang terakhir jadi tanda maju -->
  <rect x="164" y="176" width="184" height="26" rx="13" fill="#4F46E5"/>
  <rect x="164" y="222" width="132" height="26" rx="13" fill="#C7D2FE"/>
  <path d="M164 268 h96" stroke="#F59E0B" stroke-width="26" stroke-linecap="round"/>
  <path d="M282 255 l34 26 l-34 26" fill="none" stroke="#F59E0B" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</symbol><symbol id="opsi3" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g3)"/>
  <!-- Lintasan terbuka: satu putaran layanan yang terus berjalan -->
  <path d="M396 256 A140 140 0 1 0 256 396" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"/>
  <!-- Kepala panah menutup putaran, searah gerakannya -->
  <g transform="translate(396,262) rotate(-90)">
    <path d="M-16 -46 L48 0 L-16 46 Z" fill="#F59E0B"/>
  </g>
  <!-- K di dalam putaran, cukup kecil supaya tidak menyentuh lintasan -->
  <rect x="196" y="196" width="30" height="120" rx="10" fill="#fff"/>
  <path d="M234 250 h40 L330 196 h-52 Z" fill="#fff"/>
  <path d="M234 262 h40 L330 316 h-52 Z" fill="#fff"/>
</symbol></defs>
  <rect width="980" height="730" fill="#F4F5FB"/>
  <text x="40" y="54" font-family="Arial" font-size="26" font-weight="bold" fill="#3730A3">Usulan Logo KaataGo</text>
  <text x="40" y="80" font-family="Arial" font-size="13.5" fill="#5B5D77">Warna mengikuti tema sekarang - tiap opsi diuji pada ukuran besar, sedang, kecil, dan di atas latar gelap</text>
  <text x="40" y="100" font-family="Arial" font-size="13.5" fill="#5B5D77">Tanpa unsur alat makan - yang diangkat: memesan sendiri lewat QR, dan pesanan yang bergerak</text>

  <g transform="translate(40,128)">
    <rect width="430" height="256" rx="20" fill="#FFFFFF" stroke="#E3E4F0"/>
    <text x="24" y="38" font-family="Arial" font-size="19" font-weight="bold" fill="#14152A">A - Panah Maju</text>
    <text x="24" y="61" font-family="Arial" font-size="12.5" fill="#5B5D77">Huruf K dengan lengan atas jadi anak panah.</text>
    <use href="#opsi0" x="24" y="80" width="124" height="124"/>
    <use href="#opsi0" x="170" y="124" width="60" height="60"/>
    <use href="#opsi0" x="248" y="152" width="32" height="32"/>
    <rect x="300" y="80" width="106" height="124" rx="14" fill="#14152A"/>
    <use href="#opsi0" x="321" y="112" width="64" height="64"/>
    <text x="170" y="200" font-family="Arial" font-size="10" fill="#8A8CA6">124 / 60 / 32 px</text>
    <text x="316" y="222" font-family="Arial" font-size="10" fill="#8A8CA6">latar gelap</text>
  </g>
  <g transform="translate(510,128)">
    <rect width="430" height="256" rx="20" fill="#FFFFFF" stroke="#E3E4F0"/>
    <text x="24" y="38" font-family="Arial" font-size="19" font-weight="bold" fill="#14152A">B - Scan &amp; Go</text>
    <text x="24" y="61" font-family="Arial" font-size="12.5" fill="#5B5D77">Sudut pemindai QR, tombol putar di tengahnya.</text>
    <use href="#opsi1" x="24" y="80" width="124" height="124"/>
    <use href="#opsi1" x="170" y="124" width="60" height="60"/>
    <use href="#opsi1" x="248" y="152" width="32" height="32"/>
    <rect x="300" y="80" width="106" height="124" rx="14" fill="#14152A"/>
    <use href="#opsi1" x="321" y="112" width="64" height="64"/>
    <text x="170" y="200" font-family="Arial" font-size="10" fill="#8A8CA6">124 / 60 / 32 px</text>
    <text x="316" y="222" font-family="Arial" font-size="10" fill="#8A8CA6">latar gelap</text>
  </g>
  <g transform="translate(40,424)">
    <rect width="430" height="256" rx="20" fill="#FFFFFF" stroke="#E3E4F0"/>
    <text x="24" y="38" font-family="Arial" font-size="19" font-weight="bold" fill="#14152A">C - Pesanan</text>
    <text x="24" y="61" font-family="Arial" font-size="12.5" fill="#5B5D77">Gelembung pesanan, baris terakhir menunjuk maju.</text>
    <use href="#opsi2" x="24" y="80" width="124" height="124"/>
    <use href="#opsi2" x="170" y="124" width="60" height="60"/>
    <use href="#opsi2" x="248" y="152" width="32" height="32"/>
    <rect x="300" y="80" width="106" height="124" rx="14" fill="#14152A"/>
    <use href="#opsi2" x="321" y="112" width="64" height="64"/>
    <text x="170" y="200" font-family="Arial" font-size="10" fill="#8A8CA6">124 / 60 / 32 px</text>
    <text x="316" y="222" font-family="Arial" font-size="10" fill="#8A8CA6">latar gelap</text>
  </g>
  <g transform="translate(510,424)">
    <rect width="430" height="256" rx="20" fill="#FFFFFF" stroke="#E3E4F0"/>
    <text x="24" y="38" font-family="Arial" font-size="19" font-weight="bold" fill="#14152A">D - Putaran</text>
    <text x="24" y="61" font-family="Arial" font-size="12.5" fill="#5B5D77">K di dalam putaran layanan yang terus berjalan.</text>
    <use href="#opsi3" x="24" y="80" width="124" height="124"/>
    <use href="#opsi3" x="170" y="124" width="60" height="60"/>
    <use href="#opsi3" x="248" y="152" width="32" height="32"/>
    <rect x="300" y="80" width="106" height="124" rx="14" fill="#14152A"/>
    <use href="#opsi3" x="321" y="112" width="64" height="64"/>
    <text x="170" y="200" font-family="Arial" font-size="10" fill="#8A8CA6">124 / 60 / 32 px</text>
    <text x="316" y="222" font-family="Arial" font-size="10" fill="#8A8CA6">latar gelap</text>
  </g>
</svg>