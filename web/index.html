<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Merchant-POS — konsol web untuk Merchant-POS Admin, Owner, Admin, dan Finance.">

  <!--
    Tanpa baris ini google_sign_in tidak punya client id di web, dan
    login gagal sebelum sempat menyentuh Supabase. Nilainya harus sama
    persis dengan SupabaseConfig.googleWebClientId — dua tempat, satu
    nilai, karena yang satu dibaca peramban sebelum Dart-nya jalan.
  -->
  <meta name="google-signin-client_id" content="1015088896093-5k1bi18rhsifjd67bduvu58hhd9s7sv3.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Merchant-POS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <!-- SVG, bukan PNG: favicon lamanya masih berlambang K, dan
       tidak ada alat pengubah SVG ke PNG di mesin ini. SVG juga
       tetap tajam di layar kepadatan berapa pun. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Merchant-POS - Order Cepat, Merchant Hebat</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
